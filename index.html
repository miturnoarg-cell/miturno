    // Adaptador ligero de íconos Lucide para navegador sin bundler
    function LucideIcon({ name, className = "w-4 h-4", ...props }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons[name]) {
          const iconNode = window.lucide.icons[name];
          const svg = window.lucide.createElement(iconNode);
          svg.setAttribute("class", className);
          ref.current.innerHTML = "";
          ref.current.appendChild(svg);
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" {...props} />;
    }

      const [selectedDay, setSelectedDay] = useState('hoy');
      const [selectedTime, setSelectedTime] = useState(null);
      const [clientName, setClientName] = useState('');
      const [clientPhone, setClientPhone] = useState('');
      const [lastCreatedBooking, setLastCreatedBooking] = useState(null);

      const [managedBizId, setManagedBizId] = useState('biz-1');
      const [merchantDayFilter, setMerchantDayFilter] = useState('hoy');
      const [showManualModal, setShowManualModal] = useState(false);
      const [showBlockModal, setShowBlockModal] = useState(false);

      const [manualServiceId, setManualServiceId] = useState('');
      const [manualStaffId, setManualStaffId] = useState('');
      const [manualTime, setManualTime] = useState('10:00');
      const [manualClientName, setManualClientName] = useState('');
      const [manualClientPhone, setManualClientPhone] = useState('');

      const [blockTime, setBlockTime] = useState('17:00');
      const [blockReason, setBlockReason] = useState('Horario reservado / Cerrado');

      const isSlotAvailable = (bizId, day, time, staffId = 'any') => {
        const isBlocked = blockedSlots.some((b) => b.businessId === bizId && b.day === day && b.time === time);
        if (isBlocked) return false;
        const biz = businesses.find((b) => b.id === bizId);
        if (!biz) return false;
        const activeAtSlot = bookings.filter((bk) => bk.businessId === bizId && bk.day === day && bk.time === time && bk.status !== 'cancelled');
        if (staffId && staffId !== 'any') return !activeAtSlot.some((bk) => bk.staffId === staffId);
        return activeAtSlot.length < biz.staff.length;
      };

      const getTodayAvailableSlots = (bizId) => TIME_SLOTS.filter((t) => isSlotAvailable(bizId, 'hoy', t, 'any'));

      const filteredBusinesses = useMemo(() => {
        return businesses.filter((biz) => {
          const matchesCat = selectedCategory === 'all' || biz.category === selectedCategory;
          const q = searchQuery.toLowerCase().trim();
          const matchesQuery =
            !q ||
            biz.name.toLowerCase().includes(q) ||
            biz.categoryLabel.toLowerCase().includes(q) ||
            biz.neighborhood.toLowerCase().includes(q) ||
            biz.services.some((s) => s.name.toLowerCase().includes(q));
          const matchesToday = !onlyAvailableToday || getTodayAvailableSlots(biz.id).length > 0;
          return matchesCat && matchesQuery && matchesToday;
        });
      }, [businesses, selectedCategory, searchQuery, onlyAvailableToday, bookings, blockedSlots]);

      const myBookings = useMemo(() => bookings.filter((b) => b.isMine), [bookings]);

      const openBookingFlow = (biz, preselectedTime = null) => {
        setBookingModalBiz(biz);
        setSelectedService(biz.services[0]);
        setSelectedStaff('any');
        setSelectedDay('hoy');
        setSelectedTime(preselectedTime);
        setBookingStep(preselectedTime ? 3 : 1);
        setLastCreatedBooking(null);
      };

      const handleConfirmClientBooking = (e) => {
        e.preventDefault();
        if (!bookingModalBiz || !selectedService || !selectedTime || !clientName.trim()) return;
        let assignedStaff;
        if (selectedStaff === 'any') {
          const busyIds = bookings
            .filter((bk) => bk.businessId === bookingModalBiz.id && bk.day === selectedDay && bk.time === selectedTime && bk.status !== 'cancelled')
            .map((bk) => bk.staffId);
          assignedStaff = bookingModalBiz.staff.find((s) => !busyIds.includes(s.id)) || bookingModalBiz.staff[0];
        } else {
          assignedStaff = bookingModalBiz.staff.find((s) => s.id === selectedStaff);
        }

        const newBooking = {
          id: `bk-${Date.now()}`,
          businessId: bookingModalBiz.id,
          serviceId: selectedService.id,
          serviceName: selectedService.name,
          price: selectedService.price,
          staffId: assignedStaff.id,
          staffName: assignedStaff.name,
          day: selectedDay,
          time: selectedTime,
          clientName: clientName.trim(),
          clientPhone: clientPhone.trim() || '223 500-0000',
          status: 'confirmed',
          source: 'app',
          isMine: true
        };

        setBookings((prev) => [newBooking, ...prev]);
        setLastCreatedBooking(newBooking);
        setBookingStep(4);
        showToast(`¡Turno confirmado en ${bookingModalBiz.name}!`);
      };

      const handleCancelBooking = (bookingId) => {
        setBookings((prev) => prev.map((bk) => (bk.id === bookingId ? { ...bk, status: 'cancelled' } : bk)));
        showToast('Turno cancelado. El horario volvió a estar disponible.', 'info');
      };

      const managedBiz = useMemo(() => businesses.find((b) => b.id === managedBizId) || businesses[0], [businesses, managedBizId]);

      const merchantBookingsForDay = useMemo(
        () => bookings.filter((b) => b.businessId === managedBiz.id && b.day === merchantDayFilter).sort((a, b) => a.time.localeCompare(b.time)),
        [bookings, managedBiz.id, merchantDayFilter]
      );

      const merchantBlockedForDay = useMemo(
        () => blockedSlots.filter((b) => b.businessId === managedBiz.id && b.day === merchantDayFilter).sort((a, b) => a.time.localeCompare(b.time)),
        [blockedSlots, managedBiz.id, merchantDayFilter]
      );

      const merchantKPIs = useMemo(() => {
        const active = merchantBookingsForDay.filter((b) => b.status !== 'cancelled');
        const revenue = active.reduce((sum, b) => sum + b.price, 0);
        const totalCapacity = TIME_SLOTS.length * managedBiz.staff.length;
        const blockedCapacity = merchantBlockedForDay.length * managedBiz.staff.length;
        const occupancy = totalCapacity > 0 ? Math.min(100, Math.round(((active.length + blockedCapacity) / totalCapacity) * 100)) : 0;
        const nextBooking = active.find((b) => b.status === 'confirmed') || null;
        return {
          count: active.length,
          revenue,
          occupancy,
          nextSlot: nextBooking ? `${nextBooking.time} hs • ${nextBooking.clientName.split(' ')[0]}` : 'Libre'
        };
      }, [merchantBookingsForDay, merchantBlockedForDay, managedBiz.staff.length]);

      const openManualBookingModal = (presetTime = null) => {
        setManualServiceId(managedBiz.services[0]?.id || '');
        setManualStaffId(managedBiz.staff[0]?.id || '');
        const firstFree = presetTime || TIME_SLOTS.find((t) => isSlotAvailable(managedBiz.id, merchantDayFilter, t, 'any')) || '10:00';
        setManualTime(firstFree);
        setManualClientName('');
        setManualClientPhone('');

      const handleCreateManualBooking = (e) => {

        if (!manualClientName.trim()) return;
        const srv = managedBiz.services.find((s) => s.id === manualServiceId) || managedBiz.services[0];
        const stf = managedBiz.staff.find((s) => s.id === manualStaffId) || managedBiz.staff[0];

        const newBk = {
          id: `bk-man-${Date.now()}`,
          businessId: managedBiz.id,
          serviceId: srv.id,
          serviceName: srv.name,
          price: srv.price,
          staffId: stf.id,
          staffName: stf.name,
          day: merchantDayFilter,
          time: manualTime,
          clientName: manualClientName.trim(),
          clientPhone: manualClientPhone.trim() || 'Mostrador / Teléfono',
          status: 'confirmed',
          source: 'manual',
          isMine: false
        };

        setBookings((prev) => [newBk, ...prev]);
        setShowManualModal(false);
        showToast(`Turno manual agregado a las ${newBk.time} hs.`);
      };

      const handleBlockSlot = (e) => {
        e.preventDefault();
        const exists = blockedSlots.some((b) => b.businessId === managedBiz.id && b.day === merchantDayFilter && b.time === blockTime);
        if (exists) {
          showToast('Ese horario ya está bloqueado.', 'info');
          return;
        }
        setBlockedSlots((prev) => [
          ...prev,
          { id: `blk-${Date.now()}`, businessId: managedBiz.id, day: merchantDayFilter, time: blockTime, reason: blockReason.trim() || 'Bloqueado desde agenda' }
        ]);
        setShowBlockModal(false);
        showToast(`Horario ${blockTime} hs bloqueado en tiempo real.`);
      };

      const handleUnblockSlot = (blockId) => {
        setBlockedSlots((prev) => prev.filter((b) => b.id !== blockId));
        showToast('Horario liberado para reservas.');
      };

      const handleCompleteBooking = (bookingId) => {
        setBookings((prev) => prev.map((bk) => (bk.id === bookingId ? { ...bk, status: 'completed' } : bk)));

      const previewSlug = toSlug(demoSlugInput || demoBusinessName);
      const previewFullUrl = `miturno.com.ar/${previewSlug}`;

      const handleApplyDemoCustomization = (e) => {

          {bookingModalBiz && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
                <div className={`bg-gradient-to-r ${bookingModalBiz.gradient} p-5 text-white relative`}>
                  <button type="button" onClick={() => setBookingModalBiz(null)} className="absolute right-4 top-4 bg-black/25 p-2 rounded-full text-white cursor-pointer"><X className="w-5 h-5" /></button>
                  <span className="text-xs font-bold bg-white/20 px-2.5 py-0.5 rounded-full">{bookingModalBiz.categoryLabel}</span>
                  <h2 className="text-xl font-black mt-1.5">{bookingModalBiz.name}</h2>
                </div>

                <div className="p-5 overflow-y-auto flex-1">
                  {bookingStep === 1 && (
                    <div>
                      <h3 className="text-sm font-extrabold mb-3">Paso 1 de 3 — Elegí un servicio</h3>
                      <div className="space-y-2.5">
                        {bookingModalBiz.services.map((srv) => (
                          <button
                            type="button"
                            key={srv.id}
                            onClick={() => setSelectedService(srv)}
                            className={`w-full text-left p-3.5 rounded-2xl border-2 flex justify-between cursor-pointer ${
                              selectedService?.id === srv.id ? 'border-[#4F46E5] bg-indigo-50/50' : 'border-slate-200'
                            }`}
                          >
                            <div>
                              <p className="font-bold text-sm">{srv.name}</p>
                              <p className="text-xs text-slate-500">{srv.duration}</p>
                            </div>
                            <span className="font-black text-sm">{formatARS(srv.price)}</span>
                          </button>
                        ))}
                      </div>
                      <button type="button" onClick={() => setBookingStep(2)} className="w-full mt-5 py-3.5 bg-[#4F46E5] text-white font-extrabold rounded-2xl cursor-pointer">Continuar</button>
                    </div>
                  )}

                  {bookingStep === 2 && (
                    <div>
                      <h3 className="text-sm font-extrabold mb-3">Paso 2 de 3 — Elegí {bookingModalBiz.staffLabel.toLowerCase()}</h3>
                      <div className="space-y-2.5">
                        <button type="button" onClick={() => setSelectedStaff('any')} className={`w-full text-left p-3.5 rounded-2xl border-2 cursor-pointer ${selectedStaff === 'any' ? 'border-[#4F46E5] bg-indigo-50/50' : 'border-slate-200'}`}>
                          <p className="font-bold text-sm">Cualquiera disponible</p>
                        </button>
                        {bookingModalBiz.staff.map((st) => (
                          <button type="button" key={st.id} onClick={() => setSelectedStaff(st.id)} className={`w-full text-left p-3.5 rounded-2xl border-2 cursor-pointer ${selectedStaff === st.id ? 'border-[#4F46E5] bg-indigo-50/50' : 'border-slate-200'}`}>
                            <p className="font-bold text-sm">{st.name}</p>
                            <p className="text-xs text-slate-500">{st.role}</p>
                          </button>
                        ))}
                      </div>
                      <button type="button" onClick={() => setBookingStep(3)} className="w-full mt-5 py-3.5 bg-[#4F46E5] text-white font-extrabold rounded-2xl cursor-pointer">Elegir día y hora</button>
                    </div>
                  )}

                  {bookingStep === 3 && (
                    <form onSubmit={handleConfirmClientBooking}>
                      <h3 className="text-sm font-extrabold mb-3">Paso 3 de 3 — Día, horario y tus datos</h3>
                      <div className="grid grid-cols-3 gap-2 mb-4">
                        {DAYS.map((d) => (
                          <button type="button" key={d.id} onClick={() => { setSelectedDay(d.id); setSelectedTime(null); }} className={`py-2 rounded-2xl border text-xs font-bold cursor-pointer ${selectedDay === d.id ? 'bg-[#4F46E5] text-white' : 'bg-white'}`}>
                            {d.label} ({d.dateStr})
                          </button>
                        ))}
                      </div>
                      <div className="grid grid-cols-4 gap-2 mb-4">
                        {TIME_SLOTS.map((slot) => {
                          const available = isSlotAvailable(bookingModalBiz.id, selectedDay, slot, selectedStaff);
                          return (
                            <button
                              type="button"
                              key={slot}
                              disabled={!available}
                              onClick={() => setSelectedTime(slot)}
                              className={`py-2 rounded-xl text-xs font-extrabold ${
                                !available ? 'bg-slate-100 text-slate-300 line-through' : selectedTime === slot ? 'bg-[#10B981] text-slate-950' : 'bg-emerald-50 text-emerald-900 border border-emerald-200 cursor-pointer'
                              }`}
                            >
                              {slot}
                            </button>
                          );
                        })}
                      </div>
                      <div className="space-y-3 bg-[#F8FAFC] p-3.5 rounded-2xl border">
                        <input type="text" required value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="Tu nombre y apellido *" className="w-full bg-white border rounded-xl px-3.5 py-2 text-sm" />
                        <input type="tel" value={clientPhone} onChange={(e) => setClientPhone(e.target.value)} placeholder="Teléfono / WhatsApp" className="w-full bg-white border rounded-xl px-3.5 py-2 text-sm" />
                      </div>
                      <button type="submit" disabled={!selectedTime || !clientName.trim()} className="w-full mt-5 py-3.5 bg-[#4F46E5] disabled:bg-slate-300 text-white font-extrabold rounded-2xl cursor-pointer">
                        {selectedTime ? `Confirmar turno • ${selectedTime} hs` : 'Seleccioná un horario libre'}
                      </button>
                    </form>
                  )}

                  {bookingStep === 4 && lastCreatedBooking && (
                    <div className="text-center py-2">
                      <h3 className="text-lg font-black text-slate-900 mb-2">¡Turno confirmado!</h3>
                      <div className="bg-[#F8FAFC] border rounded-2xl p-4 text-left my-4 text-xs space-y-1.5">
                        <p>✅ <strong>MiTurno</strong> — {bookingModalBiz.name}</p>
                        <p>📅 {DAYS.find((d) => d.id === lastCreatedBooking.day)?.label} a las <strong>{lastCreatedBooking.time} hs</strong></p>
                        <p>✂️ {lastCreatedBooking.serviceName} ({lastCreatedBooking.staffName})</p>
                        <p>👤 {lastCreatedBooking.clientName} • {formatARS(lastCreatedBooking.price)}</p>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          setBookingModalBiz(null);
                          setManagedBizId(bookingModalBiz.id);
                          setAppMode('merchant');
                        }}
                        className="w-full py-3 bg-[#4F46E5] text-white font-extrabold rounded-2xl text-xs cursor-pointer"
                      >
                        Ver reflejado en Modo Comercio →
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL TURNO MANUAL */}
          {showManualModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-black">Agregar Turno Manual</h3>
                  <button type="button" onClick={() => setShowManualModal(false)} className="p-1.5"><X className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleCreateManualBooking} className="space-y-3.5">
                  <select value={manualServiceId} onChange={(e) => setManualServiceId(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-sm">
                    {managedBiz.services.map((s) => <option key={s.id} value={s.id}>{s.name} ({formatARS(s.price)})</option>)}
                  </select>
                  <div className="grid grid-cols-2 gap-3">
                    <select value={manualStaffId} onChange={(e) => setManualStaffId(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-sm">
                      {managedBiz.staff.map((st) => <option key={st.id} value={st.id}>{st.name}</option>)}
                    </select>
                    <select value={manualTime} onChange={(e) => setManualTime(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-sm">
                      {TIME_SLOTS.map((t) => <option key={t} value={t}>{t} hs</option>)}
                    </select>
                  </div>
                  <input type="text" required value={manualClientName} onChange={(e) => setManualClientName(e.target.value)} placeholder="Nombre del cliente *" className="w-full border rounded-xl px-3.5 py-2 text-sm" />
                  <input type="text" value={manualClientPhone} onChange={(e) => setManualClientPhone(e.target.value)} placeholder="Teléfono (opcional)" className="w-full border rounded-xl px-3.5 py-2 text-sm" />
                  <button type="submit" className="w-full py-3 bg-[#4F46E5] text-white font-extrabold rounded-2xl text-sm cursor-pointer">Guardar en agenda</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL BLOQUEAR */}
          {showBlockModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-black">Bloquear Horario</h3>
                  <button type="button" onClick={() => setShowBlockModal(false)} className="p-1.5"><X className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleBlockSlot} className="space-y-4">
                  <select value={blockTime} onChange={(e) => setBlockTime(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-sm font-bold">
                    {TIME_SLOTS.map((t) => <option key={t} value={t}>{t} hs</option>)}
                  </select>
                  <input type="text" value={blockReason} onChange={(e) => setBlockReason(e.target.value)} placeholder="Motivo" className="w-full border rounded-xl px-3.5 py-2 text-sm" />
                  <button type="submit" className="w-full py-3 bg-[#10B981] text-slate-950 font-extrabold rounded-2xl text-sm cursor-pointer">Bloquear horario</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL PERSONALIZAR DEMO */}
          {showCustomizeModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl border max-h-[92vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-black">Personalizar Demo</h3>
                  <button type="button" onClick={() => setShowCustomizeModal(false)} className="p-1.5"><X className="w-5 h-5" /></button>
                </div>

                <div className="bg-[#F8FAFC] border border-indigo-200 rounded-2xl p-3.5 mb-4">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[11px] font-extrabold text-[#4F46E5]">Vista previa del enlace</span>
                    <button type="button" onClick={handleCopyDemoLink} className="text-xs font-bold text-[#4F46E5] bg-indigo-50 px-2.5 py-1 rounded-lg cursor-pointer">Copiar link</button>
                  </div>
                  <div className="font-mono text-xs sm:text-sm font-bold bg-white border rounded-xl px-3 py-2">{previewFullUrl}</div>
                </div>

                <form onSubmit={handleApplyDemoCustomization} className="space-y-3.5">
                  <input type="text" required value={demoBusinessName} onChange={(e) => { setDemoBusinessName(e.target.value); setDemoSlugInput(toSlug(e.target.value)); }} placeholder="Nombre del comercio *" className="w-full border rounded-xl px-3.5 py-2 text-sm" />
                  <input type="text" value={demoSlugInput} onChange={(e) => setDemoSlugInput(toSlug(e.target.value))} placeholder="Slug del enlace" className="w-full border rounded-xl px-3.5 py-2 text-sm font-mono" />
                  <div className="grid grid-cols-2 gap-3">
                    <select value={demoCategory} onChange={(e) => setDemoCategory(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-sm">
                      {CATEGORIES.filter((c) => c.id !== 'all').map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                    <input type="text" value={demoNeighborhood} onChange={(e) => setDemoNeighborhood(e.target.value)} placeholder="Barrio / Zona" className="w-full border rounded-xl px-3.5 py-2 text-sm" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <input type="text" value={demoServiceName} onChange={(e) => setDemoServiceName(e.target.value)} placeholder="Servicio principal" className="w-full border rounded-xl px-3.5 py-2 text-sm" />
                    <input type="number" value={demoServicePrice} onChange={(e) => setDemoServicePrice(e.target.value)} placeholder="Precio" className="w-full border rounded-xl px-3.5 py-2 text-sm" />
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-[#4F46E5] text-white font-extrabold rounded-2xl text-sm cursor-pointer">
                    Aplicar y abrir demo
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
